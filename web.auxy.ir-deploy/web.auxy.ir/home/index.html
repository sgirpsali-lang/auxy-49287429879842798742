<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auxy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/auxy-black.png" type="image/png">
<link rel="stylesheet" href="/css/app.css?v=main-20260925-final4">
<style>html{visibility:hidden;background:#000}
.boot-msg pre{white-space:pre-wrap;text-align:start;background:#141414;color:#ff8b87;padding:10px 14px;border-radius:10px;font-size:.78rem;margin:14px 0;max-height:160px;overflow:auto;direction:ltr}
</style>
<script>
  window.AUXY_CFG = { vastTag: null };
</script>
</head>
<body>
<div id="glow" aria-hidden="true"></div>
<div id="boot"><div class="boot-in"><div class="boot-mark">
  <img src="/auxy-white.png" alt="" class="lg-d"><img src="/auxy-black.png" alt="" class="lg-l">
</div><div class="boot-bar"><i></i></div></div></div>

<div id="app" hidden>
  <header id="top"></header>
  <main id="view" class="view"></main>
  <nav id="tabbar" aria-label="ناوبری پایین"></nav>
</div>

<div id="ov"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var watchdog=setTimeout(function(){fail('پاسخی از سرور دریافت نشد (Timeout).','ممکن است اتصال اینترنت، فیلترشکن یا دسترسی به Supabase مشکل داشته باشد.');},20000);
  function fail(title,detail,err){
    clearTimeout(watchdog);document.documentElement.style.visibility='visible';
    var extra='';try{if(err)extra='<pre>'+String(err.message||err)+'</pre>';}catch(e){}
    document.getElementById('boot').innerHTML='<div class="boot-msg"><h2>'+title+'</h2><p>'+detail+'</p>'+extra+'<button class="btn primary" onclick="location.reload()">تلاش دوباره</button> <button class="btn ghost" onclick="window.AUXY&&AUXY.signOut?AUXY.signOut():location.replace(\'/login/\')">خروج</button></div>';
  }
  function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=function(){reject(new Error('failed to load '+src));};document.head.appendChild(s);});}
  async function getAuth(){
    if(!window.supabase){
      var urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.117.1/dist/umd/supabase.js'];
      var loaded=false;for(var i=0;i<urls.length;i++){try{await loadScript(urls[i]);loaded=true;break;}catch(e){}}
      if(!loaded)throw new Error('کتابخانه Supabase بارگذاری نشد.');
    }
    await loadScript('/js/auth.js?v=main-20260925-final4');
    if(!window.AUXY||!window.AUXY.client)throw new Error('Auth client ساخته نشد.');
    return window.AUXY;
  }
  getAuth().then(function(A){
    return A.getSession().then(function(session){
      if(!session){location.replace('/login/');return;}
      return Promise.all([loadScript('/js/core.js?v=main-20260925-final4'),loadScript('/js/security.js?v=main-20260925-final4')]).then(function(){
        clearTimeout(watchdog);document.documentElement.style.visibility='visible';
        var boot2=setTimeout(function(){fail('پروفایل شما بارگذاری نشد.','نشست ورود ساخته شده، اما اطلاعات حساب از دیتابیس آماده نشد. SQL نسخه نهایی را روی همین پروژه اجرا کنید.');},15000);
        return Promise.resolve(A.core.boot(session)).catch(function(e){fail('ورود شما کامل نشد.','در آماده‌سازی پروفایل یا دیتابیس خطایی رخ داد.',e);}).finally(function(){clearTimeout(boot2);});
      });
    });
  }).catch(function(e){fail('اتصال ورود آماده نشد.','کتابخانه یا کلاینت احراز هویت در دسترس نبود. صفحه را تازه‌سازی کنید.',e);});
})();
</script></body></html>
